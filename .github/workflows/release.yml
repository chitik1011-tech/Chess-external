name: Publish Chess External APK to Releases

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/release.yml' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.3.0-imgui-beta.1
      APK_BUILD_RUN: 43976888091
    steps:
      - name: Download verified APK artifact from successful build
        run: |
          set -euo pipefail
          gh run view "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -qx success
          mkdir -p release-apk
          gh run download "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name Chess-External-arm64-debug --dir release-apk
          find release-apk -type f -name '*.apk' -print
          find release-apk -type f -name '*.apk' -print -quit | grep -q apk
          APK="$(find release-apk -type f -name '*.apk' | head -n 1)"
          cp "$APK" release-apk/Chess-External-arm64-debug.apk
          sha256sum release-apk/Chess-External-arm64-debug.apk

      - name: Publish prerelease with APK
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Chess External v0.3.0 beta — real Dear ImGui + OpenGL ES3 overlay (ARM64)" \
              --prerelease \
              --notes "Chess External v0.3.0 ImGui browser bridge beta for Android ARM64. REAL Dear ImGui v1.93.0 + OpenGL ES3 native rendering through C++ JNI, NOT Android Canvas. Displays native translucent overlay with neon source/target squares, arrow, percentage badge, and capture/check/mate particle effects. Uses loopback browser bridge on 127.0.0.1:8765 with pairing code; browser extension v0.9.1 ZIP separately required. Fixed browser CORS/private-network OPTIONS preflight handling. The Android APK CI build passed with explicit checks that libchessimgui.so AND libstockfish.so are present inside the ARM64 APK. Browser extension v0.9.1 includes mobile settings scrolling and clearer localhost connection diagnostics. FLAG_SECURE cannot guarantee the overlay will disappear cleanly in screen recording; some recorders show a black box. Not yet validated on ColorOS 15/Titanium. Suitable for offline practice, bot matches and permitted analysis. Upstream OpenCheps MIT, Stockfish GPL-3.0, Dear ImGui MIT."
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets

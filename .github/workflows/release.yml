name: Publish Chess External APK to Releases

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/release.yml' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.5-beta.1
      APK_BUILD_RUN: 43954943328
    steps:
      - name: Download verified APK artifact from successful build
        run: |
          set -euo pipefail
          gh run view "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -qx success
          mkdir -p release-apk
          gh run download "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name Chess-External-arm64-debug --dir release-apk
          find release-apk -type f -name '*.apk' -print
          find release-apk -type f -name '*.apk' -print -quit | grep -q apk
          APK="$(find release-apk -type f -name '*.apk' | head -n 1)"
          cp "$APK" release-apk/Chess-External-arm64-debug.apk
          sha256sum release-apk/Chess-External-arm64-debug.apk

      - name: Publish prerelease with APK
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Chess External v0.1.5 beta — async Stockfish and capture recovery (ARM64)" \
              --prerelease \
              --notes "Chess External v0.1.5 beta (Android ARM64). Main fix: Stockfish analysis now runs asynchronously on its own HandlerThread, preventing 1500ms think time from blocking MediaProjection sampling. Captured positions are checked with exact one/two legal-move replay including normal captures (example Nxg5 f6). Spurious classifier changes no longer reset Stockfish and make hints flicker/recompute; cached analysis is reused after position stabilizes. Java regression tests and full Android build succeeded. Stockfish 19 included. Limitations: not yet tested on the user's Android device. More than two missed moves, inaccurate piece recognition, castling, en-passant, promotions and complex captures can still leave Position unclear. On-screen arrow exclusion from recordings is NOT guaranteed with FLAG_SECURE. Intended for offline study, bot play and permitted analysis. OpenCheps MIT, Stockfish GPL-3.0."
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets

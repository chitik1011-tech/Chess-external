name: Publish Chess External APK to Releases

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/release.yml' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.4-beta.1
      APK_BUILD_RUN: 43949017698
    steps:
      - name: Download verified APK artifact from successful build
        run: |
          set -euo pipefail
          gh run view "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -qx success
          mkdir -p release-apk
          gh run download "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name Chess-External-arm64-debug --dir release-apk
          find release-apk -type f -name '*.apk' -print
          find release-apk -type f -name '*.apk' -print -quit | grep -q apk
          APK="$(find release-apk -type f -name '*.apk' | head -n 1)"
          cp "$APK" release-apk/Chess-External-arm64-debug.apk
          sha256sum release-apk/Chess-External-arm64-debug.apk

      - name: Publish prerelease with APK
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Chess External v0.1.4 beta — occupancy-based move reconstruction (ARM64)" \
              --prerelease \
              --notes "Chess External v0.1.4 beta (Android ARM64). Fixes: new occupancy-based board recognition measures foreground silhouettes against each square's own background; it handles highlighted yellow squares and bypasses noisy piece-class errors that produced 'Position unclear · 10 changed'. Validates one or two QUIET moves and clears old arrows; ambiguous/illegal detections remain blocked. Java tests cover 1.e4 d5, black orientation and synthetic highlighted boards; Android Gradle build passed. Stockfish 19 included. Limitations: requires prior starting-position calibration; captures, castling, promotion, ambiguous occupancy and other complex sequences may still require manual recalibration. Real-device validation pending. Secure-overlay behavior varies by Android firmware; this does not guarantee a clean screenshot or recording. Intended for offline study, bots and permitted analysis. OpenCheps MIT; Stockfish GPL-3.0."
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets

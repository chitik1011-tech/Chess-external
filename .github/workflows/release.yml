name: Publish Chess External APK to Releases

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/release.yml' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.3-beta.1
      APK_BUILD_RUN: 43944093339
    steps:
      - name: Download verified APK artifact from successful build
        run: |
          set -euo pipefail
          gh run view "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -qx success
          mkdir -p release-apk
          gh run download "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name Chess-External-arm64-debug --dir release-apk
          find release-apk -type f -name '*.apk' -print
          find release-apk -type f -name '*.apk' -print -quit | grep -q apk
          APK="$(find release-apk -type f -name '*.apk' | head -n 1)"
          cp "$APK" release-apk/Chess-External-arm64-debug.apk
          sha256sum release-apk/Chess-External-arm64-debug.apk

      - name: Publish prerelease with APK
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Chess External v0.1.3 beta — highlight-safe board recognition (ARM64)" \
              --prerelease \
              --notes "Chess External v0.1.3 beta (Android ARM64). Fixes: classify piece shapes with normalized luminance instead of raw cell brightness so yellow move highlights are less likely to trigger false changes; stabilize detected board position across frames; retain two-move recovery and stale-arrow safety. Pure Java image-shape tests and Android Gradle assembly passed. Stockfish 19 included. Limitations: recognition still depends on chess theme and calibration; not yet verified on user's device; only two quiet moves can be recovered; custom shapes, captures, castling, and promotion may need recalibration. Secure-overlay behavior varies by Android firmware and cannot guarantee invisible screen recording. May need to uninstall old debug APK if signing differs. OpenCheps MIT; Stockfish GPL-3.0. For study, bots, and permitted analysis."
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets

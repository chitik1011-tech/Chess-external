name: Publish Chess External APK to Releases

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/release.yml' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.0-browser-beta.1
      APK_BUILD_RUN: 43972652649
    steps:
      - name: Download verified APK artifact from successful build
        run: |
          set -euo pipefail
          gh run view "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -qx success
          mkdir -p release-apk
          gh run download "$APK_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name Chess-External-arm64-debug --dir release-apk
          find release-apk -type f -name '*.apk' -print
          find release-apk -type f -name '*.apk' -print -quit | grep -q apk
          APK="$(find release-apk -type f -name '*.apk' | head -n 1)"
          cp "$APK" release-apk/Chess-External-arm64-debug.apk
          sha256sum release-apk/Chess-External-arm64-debug.apk

      - name: Publish prerelease with APK
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-apk/Chess-External-arm64-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Chess External v0.2.0 beta — native browser bridge overlay (ARM64)" \
              --prerelease \
              --notes "Chess External v0.2.0 browser bridge beta (Android ARM64). NEW: optional native companion for the Chess Board Trainer v0.9 browser extension. When enabled in the app, a local authenticated HTTP server listens ONLY on 127.0.0.1:8765 and receives engine-suggested move, board geometry, color orientation, arrow/neon mode, and quality percentage directly from the extension, without MediaProjection or camera. User can copy a 12-digit pairing code and adjust Y-offset alignment in the app. A board-sized TYPE_APPLICATION_OVERLAY with FLAG_SECURE renders hints outside the web page. The previous screen-recognition mode remains available. IMPORTANT: the browser extension ZIP is a SEPARATE download; browser integration requires it, this APK alone does not read browser DOM. FLAG_SECURE does NOT guarantee clean recordings: some Android builds black out the protected region or screen. Android CI assembly succeeded; untested on a real OnePlus/ColorOS 15. Experimental beta for study, bot play and permitted analysis. OpenCheps MIT, Stockfish GPL-3.0."
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets

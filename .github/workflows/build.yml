name: Build Chess External APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPSTREAM_COMMIT: b1eadc58d8dcf96f84976ccf49ac6d3c1be2ccc0
      SF19_ARM64_SHA: ebb24051aa4a222b4daaf049b882ecf1163d370c128fe02316602643f4d5e426

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Run privacy patch tests
        run: python3 -m unittest discover -s tests -v

      - name: Get pinned OpenCheps source
        run: |
          git clone https://github.com/Sethdsai/opencheps.git upstream
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Patch overlay privacy and verify position-safe arrows
        run: |
          python3 scripts/apply_privacy.py upstream
          python3 scripts/patch_runtime.py upstream
          install -Dm644 patches/MissedMoveRecovery.java upstream/app/src/main/java/com/opencheps/vision/MissedMoveRecovery.java
          python3 scripts/patch_recovery.py upstream
          python3 scripts/patch_classifier.py upstream
          install -Dm644 patches/OccupancyRecovery.java upstream/app/src/main/java/com/opencheps/vision/OccupancyRecovery.java
          install -Dm644 patches/ForegroundOccupancy.java upstream/app/src/main/java/com/opencheps/vision/ForegroundOccupancy.java
          python3 scripts/patch_occupancy.py upstream
          install -Dm644 patches/MixedMoveRecovery.java upstream/app/src/main/java/com/opencheps/vision/MixedMoveRecovery.java
          python3 scripts/patch_streaming.py upstream
          grep -n 'FLAG_SECURE' upstream/app/src/main/java/com/opencheps/overlay/{OverlayService,FloatingPanel}.java
          grep -n 'getLocationOnScreen\|recalibrate if persistent\|lastPvs' upstream/app/src/main/java/com/opencheps/{overlay/ArrowOverlayView,capture/ScreenCaptureService}.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test safe two-move recovery logic
        run: |
          mkdir -p /tmp/chess-test-classes
          javac -d /tmp/chess-test-classes patches/MissedMoveRecovery.java tests/java/MissedMoveRecoveryTest.java
          java -cp /tmp/chess-test-classes com.opencheps.vision.MissedMoveRecoveryTest
          javac -d /tmp/chess-test-classes \
            tests/java/android/graphics/Bitmap.java \
            upstream/app/src/main/java/com/opencheps/vision/SquareSampler.java \
            tests/java/com/opencheps/vision/SquareSamplerTest.java
          java -cp /tmp/chess-test-classes com.opencheps.vision.SquareSamplerTest
          javac -d /tmp/chess-test-classes \
            patches/MissedMoveRecovery.java patches/OccupancyRecovery.java \
            tests/java/com/opencheps/vision/OccupancyRecoveryTest.java
          java -cp /tmp/chess-test-classes com.opencheps.vision.OccupancyRecoveryTest
          javac -d /tmp/chess-test-classes \
            tests/java/android/graphics/Bitmap.java \
            tests/java/com/opencheps/vision/BoardDetector.java \
            patches/ForegroundOccupancy.java \
            tests/java/com/opencheps/vision/ForegroundOccupancyTest.java
          java -cp /tmp/chess-test-classes com.opencheps.vision.ForegroundOccupancyTest
          javac -d /tmp/chess-test-classes \
            patches/MixedMoveRecovery.java \
            tests/java/com/opencheps/vision/MixedMoveRecoveryTest.java
          java -cp /tmp/chess-test-classes com.opencheps.vision.MixedMoveRecoveryTest

      - name: Configure Android SDK from GitHub runner
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Gradle wrapper 8.7
        working-directory: upstream
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Download official Stockfish 19 ARM64 and verify checksum
        run: |
          set -euo pipefail
          mkdir -p sf-cache/arm64
          curl -fL --retry 3 -o sf-cache/arm64.tar.gz \
            'https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz'
          echo "${SF19_ARM64_SHA}  sf-cache/arm64.tar.gz" | sha256sum -c -
          tar -xzf sf-cache/arm64.tar.gz -C sf-cache/arm64
          find sf-cache/arm64 -maxdepth 4 -type f -print
          ARM64_BIN="$(find sf-cache/arm64 -type f -name '*stockfish*android*' ! -name '*.txt' | head -n 1)"
          test -n "$ARM64_BIN"
          file "$ARM64_BIN" | grep -q ELF
          install -Dm755 "$ARM64_BIN" upstream/app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Build Android ARM64 debug APK
        working-directory: upstream
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: List APKs
        run: find upstream/app/build/outputs/apk -name '*.apk' -type f -print -exec ls -lh {} \;

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-External-arm64-debug
          path: upstream/app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
